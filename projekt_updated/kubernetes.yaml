# ============================================================
# Micro-E-Commerce – Kubernetes Manifest (alles in einer Datei)
# Deploy:  kubectl apply -f kubernetes.yaml
# Löschen: kubectl delete -f kubernetes.yaml
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: micro-ecommerce

---
# ── Shared Secret (JWT) ──────────────────────────────────────
# WICHTIG: In Produktion JWT_SECRET durch einen sicheren Wert ersetzen!
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: micro-ecommerce
type: Opaque
stringData:
  JWT_SECRET: "super-geheimes-jwt-secret"

---
# ── PersistentVolumeClaims (JSON-Datenspeicher) ───────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-data-pvc
  namespace: micro-ecommerce
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inventory-data-pvc
  namespace: micro-ecommerce
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-data-pvc
  namespace: micro-ecommerce
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notification-data-pvc
  namespace: micro-ecommerce
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi

---
# ── ConfigMap für Frontend-HTML (Serving via Gateway) ────────
# Das Frontend wird als ConfigMap eingebunden, damit es im
# Gateway-Container unter /app/frontend erreichbar ist.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-files
  namespace: micro-ecommerce
binaryData: {}
# Hinweis: Die HTML-Dateien müssen manuell als ConfigMap erstellt werden:
#   kubectl create configmap frontend-files \
#     --from-file=shop.html=./frontend/shop.html \
#     --from-file=checkout.html=./frontend/checkout.html \
#     --from-file=admin.html=./frontend/admin.html \
#     -n micro-ecommerce
# Alternativ: kubectl apply -f kubernetes.yaml erstellt den leeren ConfigMap,
# dann separat befüllen (siehe README Abschnitt Kubernetes).

---
# ══════════════════════════════════════════════════════════════
# PRODUCT SERVICE
# ══════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: micro-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: micro-ecommerce/product-service:latest
          imagePullPolicy: IfNotPresent   # Lokales Image (minikube)
          ports:
            - containerPort: 8001
          env:
            - name: DATA_FILE
              value: "/app/data/products.json"
          volumeMounts:
            - mountPath: /app/data
              name: product-data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: product-data
          persistentVolumeClaim:
            claimName: product-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: micro-ecommerce
spec:
  selector:
    app: product-service
  ports:
    - port: 8001
      targetPort: 8001

---
# ══════════════════════════════════════════════════════════════
# INVENTORY SERVICE
# ══════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: micro-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: micro-ecommerce/inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: DATA_FILE
              value: "/app/data/inventory.json"
          volumeMounts:
            - mountPath: /app/data
              name: inventory-data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: inventory-data
          persistentVolumeClaim:
            claimName: inventory-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: micro-ecommerce
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8002
      targetPort: 8002

---
# ══════════════════════════════════════════════════════════════
# NOTIFICATION SERVICE
# ══════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: micro-ecommerce
spec:
  replicas: 1
  # Wichtig: Nicht auf >1 skalieren! SSE-Queue ist In-Memory,
  # mehrere Replicas würden unterschiedliche Queues haben.
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: micro-ecommerce/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
          env:
            - name: DATA_FILE
              value: "/app/data/notifications.json"
          volumeMounts:
            - mountPath: /app/data
              name: notification-data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: notification-data
          persistentVolumeClaim:
            claimName: notification-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: micro-ecommerce
spec:
  selector:
    app: notification-service
  ports:
    - port: 8004
      targetPort: 8004

---
# ══════════════════════════════════════════════════════════════
# ORDER SERVICE
# ══════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: micro-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: micro-ecommerce/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          env:
            - name: DATA_FILE
              value: "/app/data/orders.json"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:8002"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8004"
          volumeMounts:
            - mountPath: /app/data
              name: order-data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: order-data
          persistentVolumeClaim:
            claimName: order-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: micro-ecommerce
spec:
  selector:
    app: order-service
  ports:
    - port: 8003
      targetPort: 8003

---
# ══════════════════════════════════════════════════════════════
# GATEWAY SERVICE
# ══════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: micro-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: micro-ecommerce/gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:8001"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:8002"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8003"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8004"
          # Frontend-HTML wird als ConfigMap eingebunden
          volumeMounts:
            - mountPath: /app/frontend
              name: frontend-files
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: frontend-files
          configMap:
            name: frontend-files

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: micro-ecommerce
spec:
  selector:
    app: gateway-service
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer   # minikube: `minikube service gateway-service -n micro-ecommerce --url`

---
# ── Ingress (optional – falls nginx-ingress-controller installiert) ────────────
# Aktivieren: minikube addons enable ingress
# /etc/hosts eintragen: 127.0.0.1 micro-ecommerce.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: micro-ecommerce
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-buffering: "off"   # Wichtig für SSE!
spec:
  rules:
    - host: micro-ecommerce.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 80
