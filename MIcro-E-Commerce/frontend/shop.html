<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroShop – Produkte</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0e0e0e;--surface:#171717;--card:#1e1e1e;--border:#2a2a2a;
    --accent:#c8f04a;--accent-dim:#9ab832;--text:#f0ede6;--muted:#888;--danger:#ff5c5c;
  }
  * { margin:0;padding:0;box-sizing:border-box; }
  body { background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh; }
  nav {
    display:flex;align-items:center;justify-content:space-between;padding:1.2rem 2.5rem;
    border-bottom:1px solid var(--border);position:sticky;top:0;
    background:rgba(14,14,14,0.92);backdrop-filter:blur(12px);z-index:100;
  }
  .logo { font-family:'Playfair Display',serif;font-size:1.5rem;letter-spacing:-0.02em; }
  .logo span { color:var(--accent); }
  .nav-right { display:flex;gap:1rem;align-items:center; }
  .nav-links { display:flex;gap:1.5rem; }
  .nav-links a { color:var(--muted);text-decoration:none;font-size:0.9rem;transition:color .2s; }
  .nav-links a:hover,.nav-links a.active { color:var(--text); }
  #nav-user { font-size:0.82rem;color:var(--muted); }
  .logout-btn { background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.35rem 0.8rem;border-radius:6px;font-family:inherit;font-size:0.8rem;cursor:pointer;transition:all .2s; }
  .logout-btn:hover { border-color:var(--danger);color:var(--danger); }
  .cart-btn { background:var(--accent);color:#0e0e0e;border:none;padding:0.5rem 1.2rem;border-radius:999px;font-family:inherit;font-weight:500;font-size:0.85rem;cursor:pointer;transition:background .2s;display:flex;align-items:center;gap:0.4rem; }
  .cart-btn:hover { background:var(--accent-dim); }
  #cart-count { background:#0e0e0e;color:var(--accent);border-radius:999px;padding:0 0.4rem;font-size:0.78rem;font-weight:700; }

  #login-banner { background:var(--surface);border-bottom:1px solid var(--border);padding:0.8rem 2.5rem;display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap; }
  #login-banner input { background:var(--card);border:1px solid var(--border);color:var(--text);padding:0.45rem 0.9rem;border-radius:7px;font-family:inherit;font-size:0.85rem;width:160px;transition:border-color .2s; }
  #login-banner input:focus { outline:none;border-color:var(--accent); }
  .login-submit { background:var(--accent);color:#0e0e0e;border:none;padding:0.45rem 1.1rem;border-radius:7px;font-family:inherit;font-weight:500;cursor:pointer;font-size:0.85rem; }
  #login-error { color:var(--danger);font-size:0.82rem; }

  .hero { padding:4rem 2.5rem 2rem;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--border); }
  .hero h1 { font-family:'Playfair Display',serif;font-size:clamp(2.5rem,5vw,4rem);line-height:1.1; }
  .hero h1 em { color:var(--accent);font-style:normal; }
  .hero p { color:var(--muted);font-size:0.9rem;max-width:260px;text-align:right;line-height:1.6; }

  .section { padding:2.5rem; }
  .section-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem; }
  .section-header h2 { font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted); }
  .product-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1px;background:var(--border); }
  .product-card { background:var(--card);padding:1.8rem;display:flex;flex-direction:column;gap:0.8rem;transition:background .2s; }
  .product-card:hover { background:#242424; }
  .product-cat { font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--accent);font-weight:500; }
  .product-name { font-family:'Playfair Display',serif;font-size:1.15rem;line-height:1.3; }
  .product-desc { font-size:0.83rem;color:var(--muted);line-height:1.5;flex:1; }
  .product-footer { display:flex;align-items:center;justify-content:space-between;margin-top:0.5rem; }
  .product-price { font-size:1.2rem;font-weight:500; }
  .product-stock { font-size:0.75rem;color:var(--muted); }
  .product-stock.low { color:#ff9f43; }
  .product-stock.out { color:var(--danger); }
  .add-btn { background:transparent;border:1px solid var(--accent);color:var(--accent);padding:0.4rem 1rem;border-radius:999px;font-family:inherit;font-size:0.82rem;cursor:pointer;transition:all .2s; }
  .add-btn:hover { background:var(--accent);color:#0e0e0e; }
  .add-btn:disabled { border-color:var(--border);color:var(--muted);cursor:not-allowed; }

  .empty { padding:4rem;text-align:center;color:var(--muted);font-size:0.9rem; }
  .loading { display:flex;gap:0.5rem;justify-content:center;padding:4rem; }
  .dot { width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite; }
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

  #cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;backdrop-filter:blur(4px)}
  #cart-drawer{position:fixed;right:0;top:0;bottom:0;width:400px;background:var(--surface);border-left:1px solid var(--border);z-index:201;display:none;flex-direction:column;transform:translateX(100%);transition:transform .3s ease}
  #cart-drawer.open{transform:translateX(0)}
  .drawer-header{padding:1.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .drawer-header h3{font-family:'Playfair Display',serif;font-size:1.2rem}
  .close-btn{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer}
  .cart-items{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1rem}
  .cart-item{display:flex;justify-content:space-between;align-items:center;padding:1rem;background:var(--card);border-radius:8px}
  .cart-item-info{flex:1}
  .cart-item-name{font-size:0.9rem;font-weight:500}
  .cart-item-price{font-size:0.8rem;color:var(--muted);margin-top:0.2rem}
  .cart-item-qty{display:flex;align-items:center;gap:0.5rem}
  .qty-btn{background:var(--border);border:none;color:var(--text);width:24px;height:24px;border-radius:4px;cursor:pointer;font-size:0.9rem}
  .qty-btn:hover{background:var(--accent);color:#0e0e0e}
  .drawer-footer{padding:1.5rem;border-top:1px solid var(--border)}
  .cart-total{display:flex;justify-content:space-between;margin-bottom:1rem}
  .cart-total strong{font-family:'Playfair Display',serif;font-size:1.3rem}
  .checkout-btn{width:100%;background:var(--accent);color:#0e0e0e;border:none;padding:0.9rem;border-radius:8px;font-family:inherit;font-size:1rem;font-weight:500;cursor:pointer}
  .checkout-btn:hover{background:var(--accent-dim)}
  #toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--surface);border:1px solid var(--border);padding:0.7rem 1.5rem;border-radius:999px;font-size:0.85rem;transition:transform .3s;z-index:300;white-space:nowrap}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast.success{border-color:var(--accent);color:var(--accent)}
  #toast.error{border-color:var(--danger);color:var(--danger)}
</style>
</head>
<body>
<nav>
  <div class="logo">Micro<span>Shop</span></div>
  <div class="nav-right">
    <div class="nav-links">
      <a href="shop.html" class="active">Shop</a>
      <a href="checkout.html">Bestellung</a>
      <a href="admin.html">Admin</a>
    </div>
    <span id="nav-user"></span>
    <button class="logout-btn" id="nav-logout" onclick="logout()" style="display:none">Abmelden</button>
    <button class="cart-btn" onclick="toggleCart()">🛒 Warenkorb <span id="cart-count">0</span></button>
  </div>
</nav>

<div id="login-banner">
  <span style="color:var(--muted);font-weight:500">Einloggen:</span>
  <input type="text" id="u" placeholder="Benutzername  (z.B. admin)">
  <input type="password" id="p" placeholder="Passwort" onkeydown="if(event.key==='Enter')login()">
  <button class="login-submit" onclick="login()">Einloggen →</button>
  <span id="login-error"></span>
</div>

<div class="hero">
  <h1>Dein <em>digitaler</em><br>Marktplatz.</h1>
  <p>Microservices-Architektur.<br>FastAPI-Backend.<br>Echtzeit-Benachrichtigungen.</p>
</div>

<div class="section">
  <div class="section-header">
    <h2>Alle Produkte</h2>
    <span id="product-count" style="font-size:0.8rem;color:var(--muted)"></span>
  </div>
  <div id="product-grid" class="product-grid">
    <div class="empty">Bitte einloggen um Produkte zu sehen.</div>
  </div>
</div>

<div id="cart-overlay" onclick="toggleCart()"></div>
<div id="cart-drawer">
  <div class="drawer-header"><h3>Warenkorb</h3><button class="close-btn" onclick="toggleCart()">×</button></div>
  <div class="cart-items" id="cart-items"></div>
  <div class="drawer-footer">
    <div class="cart-total"><span>Gesamt</span><strong id="cart-total">€0.00</strong></div>
    <button class="checkout-btn" onclick="goCheckout()">Zur Kasse →</button>
  </div>
</div>
<div id="toast"></div>

<script>
const API = window.location.port === '8080' ? 'http://localhost:8080' : 'http://localhost:8000';
let token = localStorage.getItem('token') || '';
let cart = JSON.parse(localStorage.getItem('cart') || '[]');
let inventory = {};

updateNavAuth();
if (token) loadProducts();
updateCartUI();

function updateNavAuth() {
  const user = localStorage.getItem('username') || '';
  const ok = !!token;
  document.getElementById('nav-user').textContent = ok ? '👤 ' + user : '';
  document.getElementById('nav-logout').style.display = ok ? 'inline-block' : 'none';
  document.getElementById('login-banner').style.display = ok ? 'none' : 'flex';
}

function logout() {
  localStorage.removeItem('token'); localStorage.removeItem('username'); localStorage.removeItem('cart');
  token = ''; cart = [];
  updateNavAuth(); updateCartUI();
  document.getElementById('product-grid').innerHTML = '<div class="empty">Bitte einloggen um Produkte zu sehen.</div>';
  document.getElementById('product-count').textContent = '';
  showToast('Erfolgreich abgemeldet', '');
}

async function login() {
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value.trim();
  const err = document.getElementById('login-error');
  err.textContent = '';
  if (!u || !p) { err.textContent = 'Bitte alle Felder ausfüllen.'; return; }
  try {
    const r = await fetch(`${API}/login`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail);
    token = d.access_token;
    localStorage.setItem('token', token); localStorage.setItem('username', u);
    updateNavAuth(); loadProducts();
  } catch(e) { err.textContent = '✗ ' + e.message; }
}

async function loadProducts() {
  document.getElementById('product-grid').innerHTML = '<div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  try {
    const h = {Authorization:'Bearer '+token};
    const [pr, ir] = await Promise.all([fetch(`${API}/api/products`,{headers:h}), fetch(`${API}/api/inventory`,{headers:h})]);
    if (pr.status === 401) { logout(); return; }
    const products = await pr.json();
    const inv = await ir.json();
    inv.forEach(i => inventory[i.product_id] = i.quantity);
    document.getElementById('product-count').textContent = products.length + ' Artikel';
    const grid = document.getElementById('product-grid');
    if (!products.length) { grid.innerHTML = '<div class="empty">Noch keine Produkte. <a href="admin.html" style="color:var(--accent)">Im Admin anlegen →</a></div>'; return; }
    grid.innerHTML = products.map(p => {
      const qty = inventory[p.id] ?? 0;
      const sc = qty===0?'out':qty<5?'low':'';
      const st = qty===0?'Nicht verfügbar':qty<5?`Nur noch ${qty}`:` ${qty} verfügbar`;
      return `<div class="product-card">
        <div class="product-cat">${p.category}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-desc">${p.description||'Keine Beschreibung'}</div>
        <div class="product-footer">
          <div><div class="product-price">€${p.price.toFixed(2)}</div><div class="product-stock ${sc}">${st}</div></div>
          <button class="add-btn" ${qty===0?'disabled':''} onclick="addToCart('${p.id}','${p.name.replace(/'/g,"\\'")}',${p.price})">+ Hinzufügen</button>
        </div></div>`;
    }).join('');
  } catch(e) { document.getElementById('product-grid').innerHTML = '<div class="empty">Fehler beim Laden.</div>'; }
}

function addToCart(id,name,price) {
  const ex = cart.find(i=>i.id===id);
  if(ex) ex.qty++; else cart.push({id,name,price,qty:1});
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartUI(); showToast('✓ '+name+' hinzugefügt','success');
}

function updateCartUI() {
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  document.getElementById('cart-count').textContent = cart.reduce((s,i)=>s+i.qty,0);
  document.getElementById('cart-total').textContent = '€'+total.toFixed(2);
  document.getElementById('cart-items').innerHTML = cart.length
    ? cart.map(i=>`<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">${i.name}</div><div class="cart-item-price">€${(i.price*i.qty).toFixed(2)}</div></div><div class="cart-item-qty"><button class="qty-btn" onclick="changeQty('${i.id}',-1)">−</button><span>${i.qty}</span><button class="qty-btn" onclick="changeQty('${i.id}',1)">+</button></div></div>`).join('')
    : '<div class="empty">Warenkorb ist leer</div>';
}

function changeQty(id,delta) {
  const i=cart.find(x=>x.id===id); if(!i) return;
  i.qty+=delta; if(i.qty<=0) cart=cart.filter(x=>x.id!==id);
  localStorage.setItem('cart',JSON.stringify(cart)); updateCartUI();
}

function toggleCart() {
  const d=document.getElementById('cart-drawer'),o=document.getElementById('cart-overlay');
  const open=d.classList.toggle('open');
  d.style.display=open?'flex':'none'; o.style.display=open?'block':'none';
  if(open) updateCartUI();
}

function goCheckout() {
  if(!cart.length){showToast('Warenkorb ist leer','error');return;}
  if(!token){showToast('Bitte erst einloggen','error');return;}
  window.location.href='checkout.html';
}

function showToast(msg,type='') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='show '+type;
  setTimeout(()=>t.className='',2500);
}
</script>
</body>
</html>
